# Manual test: can this script read Workable's cross-employer job search?
# Saves nothing and uses no secrets. Results appear on the run's summary page.
# Run it from the Actions tab: "Probe Workable search" > "Run workflow".

name: Probe Workable search

on:
  workflow_dispatch:
    inputs:
      terms:
        description: "Search terms, comma separated (blank = the default list)"
        type: string
        default: ""
      pages:
        description: "Pages to read per term"
        type: string
        default: "3"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs are passed through environment variables, never pasted into
      # the shell command, so a term can't be read as a command.
      - name: Probe
        env:
          TERMS: ${{ inputs.terms }}
          PAGES: ${{ inputs.pages }}
        run: |
          args=(--pages "${PAGES:-3}")
          if [ -n "$TERMS" ]; then
            IFS=',' read -ra list <<< "$TERMS"
            trimmed=()
            for t in "${list[@]}"; do t="$(echo "$t" | xargs)"; [ -n "$t" ] && trimmed+=("$t"); done
            args+=(--terms "${trimmed[@]}")
          fi
          python probe_workable.py "${args[@]}"
