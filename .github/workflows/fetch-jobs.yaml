# Fetch jobs from ATS APIs and write them to Airtable.
# Runs once a day, plus a manual "Run workflow" button on the Actions tab.

name: Fetch Jobs

on:
  schedule:
    # Cron here is UTC only: 06:00 UTC is 07:00 UK time in summer, 06:00 in
    # winter. GitHub often starts scheduled runs hours late on busy days.
    - cron: "0 6 * * *"
  workflow_dispatch:

# The job only reads the code. Airtable access comes from the secret below,
# not from GitHub's token, so GitHub's token gets no write access.
permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Fetch jobs
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python run.py
