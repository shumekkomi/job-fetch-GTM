# Fetch jobs from ATS APIs and save them to Supabase (or Airtable, per
# `storage` in config.yaml). Runs three times a day, plus a manual "Run
# workflow" button on the Actions tab, which can also do a dry run.

name: Fetch Jobs

on:
  schedule:
    # Three runs a day so new roles are seen within hours (since 11 Nov 2026).
    # Cron here is UTC only: these are 07:17, 12:17 and 17:17 UK time in
    # winter, an hour later in summer. GitHub often starts scheduled runs late,
    # most of all at the top of the hour, hence :17. The LinkedIn 24-hour
    # window covers the gaps between runs; already-saved roles are skipped.
    - cron: "17 7,12,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch, filter and dedup, but save nothing"
        type: boolean
        default: false
      catch_up:
        description: "Catch-up: LinkedIn searches with no date limit (one-off sweep of older roles)"
        type: boolean
        default: false

# The job only reads the code. Database access comes from the secrets below,
# not from GitHub's token, so GitHub's token gets no write access.
permissions:
  contents: read

# A late scheduled run can overlap the next one. Queue it instead of running
# both at once, so two runs never save the same new role in parallel.
concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Each LinkedIn search runs twice (24h and 3 days) since 11 Nov 2026; a dry
    # run then took 21 minutes, so 25 left too little room.
    timeout-minutes: 45

    steps:
      # Actions are pinned to exact commits: a tag like v4 can be moved to new
      # code by whoever controls it, a commit hash cannot.
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      # Stored as secrets rather than in config.yaml so the public repo and
      # the public run logs (secrets are masked) never show where results go.
      # The Airtable secrets are only read if config.yaml switches back to it.
      - name: Fetch jobs
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_JOBS_TABLE_ID: ${{ secrets.AIRTABLE_JOBS_TABLE_ID }}
          AIRTABLE_RUNLOG_TABLE_ID: ${{ secrets.AIRTABLE_RUNLOG_TABLE_ID }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          CATCH_UP: ${{ inputs.catch_up && '--catch-up' || '' }}
        run: python run.py $DRY_RUN $CATCH_UP
