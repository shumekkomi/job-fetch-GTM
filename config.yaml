# -------------------------------------------------------------------
# Job Fetcher Configuration
# -------------------------------------------------------------------
# This file controls which companies to fetch from, which titles to
# match, and where to write in Airtable. Edit it freely -- the script
# reads it fresh on every run.
#
# To add a company:
#   1. Find its ATS (check where "Apply" links point on its careers page).
#   2. Find its slug (the bit after the ATS domain in the apply URL).
#   3. Test: curl the endpoint and confirm you get jobs back.
#   4. Add an entry below under `companies`.
#
# To pause a company: change its status to "paused".
# To mark one as broken: status "broken" (it will be skipped with a note).
# -------------------------------------------------------------------

default_location: "London"

# Drop roles that state a GBP salary below this. Roles with no salary, or a
# salary in another currency, are kept.
salary_floor_gbp: 30000

# Keep remote roles from any region, not only London ones. Each is labelled in
# Location: "(Remote, UK eligibility unconfirmed)" when no region is named, or
# "(Remote, listed for another region: check UK eligibility)" when it names
# the US, Canada, APAC and so on. Filter on that text in Airtable.
include_remote: true

# Your CV (.txt or .md), used to score jobs 0-100 by keyword match.
# private/ is git-ignored, so the CV never ends up in the repo. Put a copy or a
# symlink there, or pass --resume on the CLI. If the file is missing (as on
# GitHub Actions), scoring is skipped with a warning.
resume_path: "private/cv.md"

# Airtable location and access come from environment variables, not this file,
# so the public repo doesn't point at anyone's base:
#   AIRTABLE_TOKEN, AIRTABLE_BASE_ID, AIRTABLE_JOBS_TABLE_ID, AIRTABLE_RUNLOG_TABLE_ID
# Only real runs need them. --dry-run works without.

# -------------------------------------------------------------------
# Title lanes
# -------------------------------------------------------------------
# Case-insensitive substring match. A job whose title contains any of
# these strings gets tagged with that lane. Order matters: first match wins.
# -------------------------------------------------------------------
title_lanes:
  # Primary target from Oct 2026: Executive / Specialist level in CRM,
  # lifecycle, retention, email and marketing ops. Listed first so these
  # win over the broader lanes below.
  CRM & Lifecycle:
    - "CRM Executive"
    - "CRM Specialist"
    - "CRM Marketing Executive"
    - "CRM Marketing Specialist"
    - "CRM Manager"
    - "Lifecycle Marketing Executive"
    - "Lifecycle Marketing Specialist"
    - "Lifecycle Executive"
    - "Lifecycle Specialist"
    - "Retention Marketing Executive"
    - "Retention Executive"
    - "Email Marketing Executive"
    - "Email Marketing Specialist"
    - "Marketing Automation Executive"
    - "Marketing Automation Specialist"
    - "Loyalty Executive"
    - "Growth Marketing Executive"
    - "Growth Marketing Specialist"
    - "Digital Marketing Executive"
    - "Marketing Operations Executive"
    - "Marketing Operations Specialist"
  # Associate-level RevOps (e.g. Ben). Analyst roles are left out on
  # purpose: they tend to be SQL-heavy.
  RevOps:
    - "Revenue Operations Associate"
    - "Revenue Operations Specialist"
    - "Revenue Operations Executive"
    - "Revenue Operations Coordinator"
    - "RevOps Associate"
    - "RevOps Specialist"
  Growth:
    - "Growth Marketing Manager"
    - "Digital Marketing Manager"
    - "E-commerce Marketing Manager"
    - "Ecommerce Marketing Manager"
    - "CRO Manager"
    - "Conversion Rate Optimisation Manager"
    - "Conversion Rate Optimization Manager"
    - "Lifecycle Marketing Manager"
    - "Marketing Automation Manager"
  Performance:
    - "Performance Marketing Manager"
    - "Paid Media Manager"
    - "SEM Manager"
    - "PPC Manager"
  GTM Engineering:
    - "GTM Engineer"
    - "Go-to-Market Engineer"
    - "Growth Engineer"
    - "Marketing Engineer"
    - "Marketing Automation Engineer"
    - "RevOps Engineer"
    - "Revenue Operations Engineer"
    - "Marketing Operations Manager"
    - "Forward Deployed Engineer"

# -------------------------------------------------------------------
# Company watchlist
# -------------------------------------------------------------------
# Fields:
#   name:           display name (used in Airtable and logs)
#   ats:            adapter to use (greenhouse, ashby, lever, smartrecruiters,
#                   personio, jsonld, workable, recruitee)
#   slug:           board identifier for the ATS API (for jsonld: the full URL)
#   careers_url:    the public careers page (for reference only)
#   tier:           priority (1 = most important, 2 = secondary, 3 = nice to have)
#   status:         active / paused / broken / unsupported
#   location_aliases: extra strings that count as "London" for this company
#   keep_unqualified_remote: if true, keep remote roles with no region stated
