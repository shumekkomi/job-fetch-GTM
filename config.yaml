# -------------------------------------------------------------------
# Job Fetcher Configuration
# -------------------------------------------------------------------
# This file controls which companies to fetch from, which titles to
# match, and where results are saved. Edit it freely -- the script
# reads it fresh on every run.
#
# To add a company:
#   1. Find its ATS (check where "Apply" links point on its careers page).
#   2. Find its slug (the bit after the ATS domain in the apply URL).
#   3. Test: curl the endpoint and confirm you get jobs back.
#   4. Add an entry below under `companies`.
#
# To pause a company: change its status to "paused".
# To mark one as broken: status "broken" (it will be skipped with a note).
# -------------------------------------------------------------------

default_location: "London"

# Drop roles that state a GBP salary below this. Roles with no salary, or a
# salary in another currency, are kept.
salary_floor_gbp: 30000

# Keep remote roles from any region, not only London ones. Each is labelled in
# Location: "(Remote, UK eligibility unconfirmed)" when no region is named, or
# "(Remote, listed for another region: check UK eligibility)" when it names
# the US, Canada, APAC and so on. Filter on that text in Airtable.
include_remote: true

# Your CV (.txt or .md), used to score jobs 0-100 by keyword match.
# private/ is git-ignored, so the CV never ends up in the repo. Put a copy or a
# symlink there, or pass --resume on the CLI. If the file is missing (as on
# GitHub Actions), scoring is skipped with a warning.
resume_path: "private/cv.md"

# Where results are saved: "supabase" (the jobhunt schema in a Supabase
# Postgres database) or "airtable". Switched from Airtable on 6 Nov 2026.
storage: supabase

# Connection details come from environment variables, not this file, so the
# public repo doesn't point at anyone's database or base:
#   supabase: SUPABASE_DB_URL (the Session pooler connection string)
#   airtable: AIRTABLE_TOKEN, AIRTABLE_BASE_ID, AIRTABLE_JOBS_TABLE_ID, AIRTABLE_RUNLOG_TABLE_ID
# Only real runs need them. --dry-run works without, and with them it also
# checks the connection and dedups against what is already saved.

# -------------------------------------------------------------------
# Title lanes
# -------------------------------------------------------------------
# A job whose title contains any of these words or phrases gets tagged with
# that lane. Matching is case-insensitive and on whole words, with hyphens
# read as spaces: "go to market" matches "Go-to-Market Engineer", and "crm"
# never matches inside another word. Order matters: first lane wins.
#
# Rewritten 11 Nov 2026 from the titles of 131 roles you applied to,
# shortlisted or skipped. Broad words plus an exclude list (below) replaced
# the long list of exact titles: the old list kept 50 of the 80 roles you
# acted on or held, this one keeps 79.
# -------------------------------------------------------------------
title_lanes:
  GTM Engineering:
    - "gtm"
    - "go to market"
    - "marketing engineer"
    - "growth engineer"
    - "marketing ai"
    - "ai growth"
    - "growth ops"
  RevOps & Systems:
    - "revops"
    - "revenue operations"
    - "sales operations"
    - "hubspot"
    - "salesforce admin"
    - "salesforce administrator"
    - "crm developer"
    - "martech"
    - "marketing operations"
    - "marketing ops"
    - "marketing automation"
  CRM & Lifecycle:
    - "crm"
    - "lifecycle"
    - "retention"
    - "loyalty"
    - "customer marketing"
    - "email marketing"
  Growth:
    - "growth marketing"
    - "growth marketer"
    - "growth manager"

# Titles with any of these words are dropped even when a lane matches.
# Senior and above, regional strategy roles, and paid media roles.
title_exclude:
  - "senior"
  - "sr"
  - "head of"
  - "director"
  - "vp"
  - "principal"
  - "regional"
  - "paid"
  - "ppc"
  - "performance"
  - "sem"

# -------------------------------------------------------------------
# Description checks
# -------------------------------------------------------------------
# Read the job description of every role whose title passed. A role with no
# description is kept. Taken from the reasons you hard-skipped roles.
# -------------------------------------------------------------------
description_checks:
  # Dropped when one of these is in the title, or the description names it
  # as a must ("hands-on", "proven", "required", "certification") without
  # offering an alternative. A role listing it next to Braze or Klaviyo, or
  # as "ideally", is kept: you apply to those.
  must_have_tools:
    - "salesforce marketing cloud"
    - "sfmc"
    - "marketing cloud"
    - "adobe journey optimizer"
    - "adobe journey optimiser"
    - "ajo"
    - "adobe campaign"
    - "marketo"
  # Dropped when the description asks for this many years or more. Ranges
  # are read by their lower number: "3 to 5 years" counts as 3.
  max_years: 5
  # Dropped when the description asks for fluent or native use of one of these.
  languages: [french, german, dutch, spanish, italian, portuguese, swedish, polish]
  # Dropped at this many paid media mentions (Google Ads, paid social, PPC...).
  paid_heavy_mentions: 9
  # Kept but flagged in Notes at this many. Testing found no count that
  # separates paid-heavy growth roles you skip from ones you apply to.
  paid_flag_mentions: 5
  # Tools listed in Notes when the description names them. In the test,
  # roles you held named about 3, roles you applied to about 2, roles you
  # hard-skipped about 1. Use the count to sort, not to filter.
  tool_flags:
    HubSpot: [hubspot]
    Zapier/Make/n8n: [zapier, n8n, make.com, integromat]
    Braze: [braze]
    Iterable: [iterable]
    Customer.io: [customer.io]
    Klaviyo: [klaviyo]
    ActiveCampaign: [activecampaign]
    SQL: [sql]
    Clay: [clay]
    API/webhooks: [api, apis, webhook, webhooks]
    AI/automation: [ai, automation, automate, automated]

# -------------------------------------------------------------------
# Company watchlist
# -------------------------------------------------------------------
# Fields:
#   name:           display name (used in Airtable and logs)
#   ats:            adapter to use (greenhouse, ashby, lever, smartrecruiters,
#                   personio, jsonld, workable, recruitee, teamtailor)
#   slug:           board identifier for the ATS API (for jsonld: the full URL;
#                   for teamtailor: the subdomain, or the full careers URL on a custom domain)
#   careers_url:    the public careers page (for reference only)
#   tier:           priority (1 = most important, 2 = secondary, 3 = nice to have)
#   status:         active / paused / broken / unsupported
#   location_aliases: extra strings that count as "London" for this company
#   keep_unqualified_remote: if true, keep remote roles with no region stated
